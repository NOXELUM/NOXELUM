<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="NOXELUM animated cyan black hole banner">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#040812"/><stop offset=".56" stop-color="#0b1a2b"/><stop offset="1" stop-color="#030912"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#12c9f7" stop-opacity=".32"/><stop offset=".55" stop-color="#0878ae" stop-opacity=".14"/><stop offset="1" stop-color="#23cbec" stop-opacity="0"/></radialGradient>
  <radialGradient id="hole" cx="34%" cy="28%" r="80%"><stop offset="0" stop-color="#000207"/><stop offset=".72" stop-color="#01050c"/><stop offset=".92" stop-color="#03111e"/><stop offset="1" stop-color="#0a3950"/></radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0477aa"/><stop offset=".24" stop-color="#5eeaff"/><stop offset=".48" stop-color="#f1ffff"/><stop offset=".68" stop-color="#15bde9"/><stop offset="1" stop-color="#07527e"/></linearGradient>
  <linearGradient id="ringThin" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#03618e" stop-opacity=".2"/><stop offset=".3" stop-color="#50dff9"/><stop offset=".52" stop-color="#e5fcff"/><stop offset=".8" stop-color="#21c9ef"/><stop offset="1" stop-color="#07527e" stop-opacity=".3"/></linearGradient>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#4ccdf0" stroke-opacity=".065"/></pattern>
  <clipPath id="holeClip"><circle cx="779" cy="158" r="69"/></clipPath>
</defs>
<rect width="1000" height="330" rx="14" fill="url(#bg)"/>
<rect width="1000" height="330" rx="14" fill="url(#grid)"/>
<ellipse cx="779" cy="158" rx="250" ry="200" fill="url(#aura)"><animate attributeName="opacity" values=".65;1;.65" dur="7s" repeatCount="indefinite"/></ellipse>
<!-- Gravitational haze and distant lensing -->
<ellipse cx="779" cy="158" rx="153" ry="57" transform="rotate(-14 779 158)" fill="none" stroke="#13bce9" stroke-width="28" opacity=".24" filter="url(#soft)"/>
<!-- The back half of the accretion disk rotates slowly around the event horizon -->
<g transform="translate(779 158) rotate(-14)">
 <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="46s" repeatCount="indefinite"/>
  <ellipse rx="137" ry="37" fill="none" stroke="#0b9bd1" stroke-width="26" opacity=".28" filter="url(#soft)"/>
  <ellipse rx="137" ry="37" fill="none" stroke="url(#ring)" stroke-width="16" opacity=".9" filter="url(#glow)"/>
  <ellipse rx="142" ry="39" fill="none" stroke="url(#ringThin)" stroke-width="3" opacity=".98"/>
  <ellipse rx="126" ry="31" fill="none" stroke="#e9fdff" stroke-width="1.7" stroke-dasharray="32 9 5 13" opacity=".9"/>
  <ellipse rx="119" ry="26" fill="none" stroke="#4adfff" stroke-width="1" stroke-dasharray="3 14 22 8" opacity=".7"/>
 </g>
</g>
<!-- Event horizon -->
<circle cx="779" cy="158" r="82" fill="#1abde9" opacity=".24" filter="url(#soft)"/>
<circle cx="779" cy="158" r="75" fill="none" stroke="#18c9f4" stroke-width="8" opacity=".32" filter="url(#glow)"/>
<circle cx="779" cy="158" r="72" fill="none" stroke="#a9f7ff" stroke-width="2.8" opacity=".95" filter="url(#glow)"/>
<circle cx="779" cy="158" r="69" fill="url(#hole)" stroke="#020914" stroke-width="4"/>
<circle cx="779" cy="158" r="62" fill="#010308" opacity=".98"/>
<!-- Gravitationally lensed light arcs around the event horizon -->
<path d="M710 151 C722 89 835 89 848 151" fill="none" stroke="#37dfff" stroke-width="5" opacity=".74" filter="url(#glow)"/>
<path d="M719 145 C739 99 819 99 839 145" fill="none" stroke="#f0feff" stroke-width="1.8" opacity=".96"/>
<path d="M714 168 C733 220 824 222 844 168" fill="none" stroke="#117da9" stroke-width="2.2" opacity=".7"/>
<!-- Bright front edge of the accretion disk, passing in front of the black hole -->
<g transform="rotate(-14 779 158)">
 <path d="M642 158 C672 209 882 209 916 158" fill="none" stroke="#12b9eb" stroke-width="23" opacity=".45" filter="url(#glow)"/>
 <path d="M642 158 C672 209 882 209 916 158" fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
 <path d="M654 162 C691 197 862 197 903 162" fill="none" stroke="#e9fdff" stroke-width="2" opacity=".98"/>
 <path d="M673 174 C718 202 842 202 883 174" fill="none" stroke="#4cdefb" stroke-width="2.4" stroke-dasharray="25 10 3 8" opacity=".9"/>
</g>
<!-- Small orbiting particles -->
<g fill="#a5f7ff">
 <circle cx="62" cy="43" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/></circle>
 <circle cx="234" cy="66" r="1"/><circle cx="475" cy="40" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="579" cy="102" r="1"/><circle cx="939" cy="78" r="1.7"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="913" cy="277" r="1.2"><animate attributeName="opacity" values=".1;1;.1" dur="4.8s" repeatCount="indefinite"/></circle>
 <circle cx="687" cy="67" r="1.4"/><circle cx="871" cy="247" r="1.5"><animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/></circle>
</g>
<path d="M0 274L100 247 188 266 290 225 390 255 480 225 560 259 644 226 730 271 811 237 922 269 1000 228V330H0Z" fill="#0b2535" opacity=".95"/>
<path d="M0 302L112 272 231 300 330 262 463 315 576 279 691 308 820 268 1000 304V330H0Z" fill="#071724"/>
<path d="M30 30h84M30 30v42M970 30h-84M970 30v42M30 300h84M30 300v-42M970 300h-84M970 300v-42" fill="none" stroke="#43d7ef" stroke-opacity=".55" stroke-width="2"/>
<text x="58" y="81" font-family="monospace" font-size="12" letter-spacing="3" fill="#64dce9">// DEVELOPER · LEARNER · EXPLORER</text>
<text x="53" y="185" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="80" letter-spacing="11" fill="#effbff">NOXELUM</text>
<rect x="58" y="203" width="90" height="3" fill="#4edff5"><animate attributeName="width" values="40;105;40" dur="5s" repeatCount="indefinite"/></rect>
<text x="58" y="246" font-family="monospace" font-size="17" letter-spacing="2.5" fill="#8ce5f3">FIND YOUR LIGHT IN THE UNKNOWN.</text>
<text x="951" y="303" text-anchor="end" font-family="monospace" font-size="10" letter-spacing="2" fill="#83a9ba">BUILD / LEARN / IMPROVE</text>
</svg>