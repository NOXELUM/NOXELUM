name: Streak and stats cards

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/streak.mjs
      - scripts/stats.mjs
      - scripts/theme.mjs
      - .github/workflows/streak.yml

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate streak card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/streak.mjs ${{ github.repository_owner }} assets/streak.svg
      - name: Generate stats card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/stats.mjs ${{ github.repository_owner }} assets/stats.svg
      - name: Recolor summary cards
        run: node scripts/theme.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg assets/stats.svg assets/lang-commit.svg assets/lang-repo.svg assets/productive-time.svg
          git diff --staged --quiet || (git commit -m "chore: update profile cards" && git push)
